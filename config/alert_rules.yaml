alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 3000 for 5 minutes
    type: symptom-based
    owner: On-call SRE (Loi)
    runbook: docs/alerts.md#alert-1
  - name: error_rate_high
    severity: critical
    condition: error_rate_pct > 2 for 5 minutes
    type: symptom-based
    owner: On-call SRE (Loi)
    runbook: docs/alerts.md#alert-2
  - name: daily_cost_budget
    severity: warning
    condition: total_cost_usd_per_window > 2.5 OR cost_rate_per_minute > 2x baseline for 10 minutes
    type: symptom-based
    owner: On-call SRE (Loi)
    runbook: docs/alerts.md#alert-3
