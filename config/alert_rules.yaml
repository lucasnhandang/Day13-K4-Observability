alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: On-call SRE (Loi)
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: On-call SRE (Loi)
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetBurn
    severity: warning
    condition: total_cost_usd_per_window > 2.5 OR cost_rate_per_minute > 2x baseline for 10m
    type: symptom-based
    owner: On-call SRE (Loi)
    runbook: docs/alerts.md#alert-3
